name: LemeHost Auto Refresh

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Open LemeHost and refresh
        env:
          LEMEHOST_IDENTITY: ${{ secrets.LEMEHOST_IDENTITY }}
          LEMEHOST_SESSION: ${{ secrets.LEMEHOST_SESSION }}
        run: |
          cat > refresh.js <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const context = await browser.newContext();

            await context.addCookies([
              {
                name: '_identity-frontend',
                value: process.env.LEMEHOST_IDENTITY,
                domain: 'lemehost.com',
                path: '/',
                secure: true
              },
              {
                name: 'advanced-frontend',
                value: process.env.LEMEHOST_SESSION,
                domain: 'lemehost.com',
                path: '/',
                secure: true
              }
            ]);

            const page = await context.newPage();

            console.log('Opening LemeHost server page...');

            await page.goto(
              'https://lemehost.com/server/view?id=10261365',
              {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              }
            );

            console.log('Page loaded:', await page.title());

            await page.waitForTimeout(10000);

            console.log('Refreshing page...');

            await page.reload({
              waitUntil: 'domcontentloaded',
              timeout: 60000
            });

            await page.waitForTimeout(10000);

            console.log('Final URL:', page.url());
            console.log('Title:', await page.title());

            if (page.url().includes('/site/login')) {
              throw new Error('LemeHost redirected to login.');
            }

            console.log('SUCCESS: LemeHost session is active.');
            await browser.close();
          })();
          EOF

          node refresh.js
