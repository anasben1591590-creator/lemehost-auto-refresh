name: LemeHost Auto Refresh

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Visit LemeHost
        run: |
          curl -L --max-time 30 https://lemehost.com/ -o /dev/null
          echo "LemeHost visited successfully"
