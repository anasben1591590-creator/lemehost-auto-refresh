name: LemeHost Auto Refresh

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Visit my LemeHost server
        run: |
          curl -L --max-time 30 \
            "https://lemehost.com/server/view?id=10261365" \
            -o /tmp/lemehost.html

          echo "Page visited."
          
          if grep -qi "login" /tmp/lemehost.html; then
            echo "WARNING: LemeHost redirected us to login."
          else
            echo "The server page appears accessible."
          fi
