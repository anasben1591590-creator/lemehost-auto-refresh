name: LemeHost Auto Refresh

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Visit LemeHost server page
        env:
          LEMEHOST_IDENTITY: ${{ secrets.LEMEHOST_IDENTITY }}
          LEMEHOST_SESSION: ${{ secrets.LEMEHOST_SESSION }}
        run: |
          set -e

          COOKIE="_identity-frontend=${LEMEHOST_IDENTITY}; advanced-frontend=${LEMEHOST_SESSION}"

          echo "Visiting LemeHost..."

          curl -sS \
            --max-time 30 \
            -A "Mozilla/5.0" \
            -H "Cookie: ${COOKIE}" \
            -D /tmp/headers.txt \
            -o /tmp/page.html \
            "https://lemehost.com/server/view?id=10261365"

          echo "HTTP response:"
          head -n 1 /tmp/headers.txt

          if grep -qiE "login|site/login" /tmp/headers.txt /tmp/page.html; then
            echo "❌ LemeHost still redirected to login."
            exit 1
          fi

          echo "✅ LemeHost server page was accessed with the saved session."
